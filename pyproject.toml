[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "puki3d"
version = "0.1.0"
description = "Aplicación de escritorio para crear y editar modelos 3D compatibles con American Truck Simulator."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.1",
    "PyOpenGL>=3.1.7",
    "PySide6>=6.8",
]

[project.scripts]
puki3d = "puki3d.main:main"

[tool.setuptools.packages.find]
where = ["src"]
